[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-f16"
version = "0.1.0"
description = "Headless JSBSim curriculum environment for the pilot-f16 project"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gymnasium==1.2.0",
  "jsbsim==1.3.1",
  "numpy==2.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]
train = ["stable-baselines3==2.7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

